name: BRAIN-02a Swift storage checks

on:
  pull_request:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - .github/workflows/brain-02a.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-02a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Validate package
        run: swift package dump-package > /dev/null
      - name: Resolve pinned dependency
        run: swift package resolve
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --parallel
