name: MANU OS web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main, "claude/**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        working-directory: web
        run: for f in app.js sw.js core/*.js; do node --check "$f"; done
      - name: Unit tests
        working-directory: web
        run: npm test

  # Publishes web/ to GitHub Pages. Only from main, and only once Manu has
  # enabled Pages with "GitHub Actions" as the source (ADR-0012).
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Audit 2026-10: publish only the app, not its tests or package.json.
      - name: Build site
        run: |
          cp -R web _site
          rm -rf _site/tests _site/package.json _site/node_modules
          test -f _site/index.html && test -f _site/sw.js && test ! -e _site/tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
