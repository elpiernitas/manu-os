name: BRAIN-01 Swift checks

on:
  pull_request:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - App/**
      - .github/workflows/brain-01.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-01-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Validate package
        run: swift package dump-package
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --parallel
      # BRAIN-02b first criterion: prove the runner's Xcode and iOS SDKs, and
      # compile the package (including the SwiftUI shell) for iOS Simulator.
      # No signing, no Apple account, no device, no cost beyond this job.
      - name: Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme ManuBrain-Package \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      # iPhone app target generated from App/project.yml with XcodeGen.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate
      - name: Build iPhone app for iOS Simulator
        run: |
          xcodebuild build \
            -project App/ManuOS.xcodeproj \
            -scheme ManuOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
